<!doctype html><meta charset="utf-8">
<style>body{margin:0;background:#fff;color:#000}.row{display:flex}.cell{width:256px;height:256px}</style>
<div id="rows"></div>
<script type="module">
import { createAvatar } from '../src/index.js'
import { CARDS } from './cards.js'
const html = await (await fetch('../reference/avatar-animazioni.html')).text()
window.eng = {}
for (const [name, [marker]] of Object.entries(CARDS)) {
  const a = html.indexOf(`<!-- ${marker} -->`), i = html.indexOf('<svg', a), j = html.indexOf('</svg>', i) + 6
  const row = document.createElement('div'); row.className = 'row'
  row.innerHTML = `<div class="cell" id="r-${name}">${html.slice(i, j).replace('<svg ', '<svg width="256" height="256" ')}</div><div class="cell" id="e-${name}"></div>`
  document.getElementById('rows').appendChild(row)
  eng[name] = createAvatar(document.getElementById('e-' + name), { state: name, size: 256 }).pause()
}
document.querySelectorAll('svg').forEach(s => s.pauseAnimations && s.pauseAnimations())
document.getAnimations().forEach(a => a.pause())
window.ready = true
</script>
